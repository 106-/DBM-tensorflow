name: train

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: make sync

      - name: Train
        run: make train
